name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Format & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive crm-infra/terraform

      - name: Run Clean & Format Pipeline
        run: python3 .githooks/clean_and_format.py --all

  csharp-tests:
    name: C# .NET API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore CrmApiCSharp/CrmApiCSharp.slnx

      - name: Build & Run xUnit tests
        run: dotnet test CrmApiCSharp/CrmApiCSharp.slnx --no-restore --verbosity normal

  kotlin-tests:
    name: Kotlin Spring Boot API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Run Gradle tests & build
        working-directory: CrmApiKotlinSpringBoot
        run: ./gradlew test bootJar --no-daemon

  database-dacpac:
    name: SQL Server DACPAC Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build SQL Server DACPAC
        run: dotnet build CRMDatabaseMS/CRMDatabaseMS/CRMDatabaseMS.sqlproj -c Release
